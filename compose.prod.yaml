services:
  api:
    container_name: GrowthLogApi
    build:
      context: .
      dockerfile: workspaces/api/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks: [back-tier]
    tty: true

  docs:
    container_name: GrowthLogDocs
    build:
      context: .
      dockerfile: workspaces/docs/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks: [back-tier]
    tty: true

  images:
    container_name: GrowthLogImages
    build:
      context: .
      dockerfile: workspaces/images/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
    networks: [back-tier]
    tty: true

  caddy:
    container_name: GrowthLogCaddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - docs
      - images
      - minio
    env_file:
      - .env
    networks: [back-tier]

  postgres:
    container_name: GrowthLogPostgres
    image: postgres:18
    env_file:
      - .env
    volumes:
      - ./.local/postgres-data:/var/lib/postgresql
    logging:
      driver: none
    networks: [back-tier]

  redis:
    container_name: GrowthLogRedis
    image: redis:8
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    logging:
      driver: none
    networks: [back-tier]

  minio:
    container_name: GrowthLogMinio
    image: pgsty/minio:latest
    command: server /data
    env_file:
      - .env
    volumes:
      - minio-data:/data
    logging:
      driver: none
    networks: [back-tier]

networks:
  back-tier:

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  minio-data:
