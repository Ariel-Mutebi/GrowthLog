name: growthlog

services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./.local/postgres-data:/var/lib/postgresql

  redis:
    image: redis:8
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - ./.local/redis-data:/data
  
  # Minio is replaced by Cloudflare R2 in prod (less server load, edge caching)
  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - ./.local/minio-data:/data

  # For local manual testing of emails
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP host
      - "8025:8025" # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - ./.local/mailpit-data:/data
