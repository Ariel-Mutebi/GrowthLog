name: growthlog

services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./.local/postgres-data:/var/lib/postgresql

  redis:
    image: redis:8
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - ./.local/redis-data:/data
  
  # Minio is replaced by Cloudflare R2 in prod (less server load, edge caching)
  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - ./.local/minio-data:/data
